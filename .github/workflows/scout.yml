name: Scout

# Runs the collector whenever a request file is added on the scout branch.
on:
  push:
    branches: [scout]
    paths: ['scout/requests/**']

permissions:
  contents: write

concurrency: scout

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run pending requests
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scout/collect.py
      - name: Save results
        run: |
          git config user.name "speshbun-scout"
          git config user.email "speshbun-scout@users.noreply.github.com"
          git add scout/results
          git diff --cached --quiet || (git commit -m "Scout results" && git push)
